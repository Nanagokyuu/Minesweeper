[package]
name = "minesweeper_core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust game core for the Minesweeper iOS app"
license = "GPL-3.0-or-later"

[lib]
name = "minesweeper_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 2
